aid: vault12
name: Vault12
description: >-
  Vault12 is a non-custodial crypto asset security company whose Vault12
  Guard mobile app backs up wallet seed phrases and private keys using
  Shamir's Secret Sharing across a decentralized network of appointed
  Guardians, with designated legacy contacts for crypto inheritance — no
  cloud storage and no custody of funds. Its developer surface is open
  source, centered on the Zax NaCl-based cryptographic relay (asynchronous
  end-to-end-encrypted device-to-device messaging and file exchange), the
  glow.ts client library, and native Shamir's Secret Sharing
  implementations, plus RFC 8414 OAuth 2.0 authorization-server metadata
  published on vault12.com and a public Zax test relay at zt.vault12.com.

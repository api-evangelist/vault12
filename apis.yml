apis:
- name: Vault12 Zax Cryptographic Relay API
  description: >-
    Open-source NaCl-based cryptographic relay operated as asynchronous
    "dead drops" for end-to-end-encrypted device-to-device communication.
    Clients establish anonymous session keys via a proof-of-work handshake
    (POST /start_session, /verify_session) and then post encrypted commands
    to /command — upload, count, download, messageStatus, delete, plus the
    Zax 2.0 file-command family (startFileUpload, uploadFileChunk,
    downloadFileChunk, fileStatus, deleteFile). Vault12 maintains a public
    test relay with 30-minute message expiration.
  humanURL: https://github.com/vault12/zax
  baseURL: https://zt.vault12.com
  tags:
  - Relay
  - Cryptography
  - Messaging
  - File Exchange
